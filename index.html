<style id="sn-trivial-law">
#sn-topchrome-drag, #cli-drag {
  height: 10px !important; min-height: 10px !important; max-height: 10px !important;
  padding: 0 !important; margin: 0 !important;
}
#sn-topchrome-drag::after, #cli-drag::after { content: none !important; display: none !important; }
#panel, #sn-topchrome-panel { min-height: 0 !important; height: auto !important; }
#panel { grid-template-rows: 10px 44px auto auto !important; overflow: visible !important; }
#sn-task-ribbon .sn-rib-face, #sn-task-ribbon .sn-rib-icon img, #sn-rib-user img {
  width: 28px !important; height: 28px !important; max-width: 28px !important; max-height: 28px !important;
  border-radius: 50% !important; object-fit: cover !important; display: block !important;
}
#sn-task-ribbon .sn-rib-btn {
  width: 36px !important; height: 36px !important; min-width: 36px !important; max-width: 36px !important;
  padding: 0 !important; border-radius: 50% !important; overflow: hidden !important; flex: 0 0 36px !important;
}
#sn-task-ribbon .sn-rib-txt { display: none !important; }
#cli-drag { grid-row: 1 !important; }
#sn-task-ribbon { grid-row: 2 !important; }
#cli-log { grid-row: 3 !important; }
#cli-form { grid-row: 4 !important; min-height: 48px !important; }
#cli-coach { display: none !important; height: 0 !important; }
#cli-log:empty { display: none !important; height: 0 !important; padding: 0 !important; }
#cli-log:not(:empty) { display: block !important; max-height: 26vh !important; overflow-y: auto !important; padding: 4px 10px 8px !important; font: 500 13px/1.35 var(--font-mono); color: #d7eef7; }
#city-map { position:fixed !important; inset:0 !important; z-index:40; opacity:0; pointer-events:none; background:#000; }
#city-map.active { z-index:80 !important; opacity:1 !important; pointer-events:auto !important; }
#city-map .leaflet-container { width:100% !important; height:100% !important; background:#05080f; }
#globe.city-hidden { visibility:hidden !important; pointer-events:none !important; }
</style>
<style>
:root{--bg:#000105;--text:#eaf4ff;--glow:#1c8cff;--glow-hot:#7ec8ff;--panel:rgba(3,10,32,0.32);--border:rgba(50,160,255,0.62);--font-ui:Inter,system-ui,sans-serif;--font-display:Space Grotesk,system-ui,sans-serif;--font-mono:JetBrains Mono,ui-monospace,monospace;--r:24px}
html,body{margin:0;width:100%;height:100%;height:100dvh;min-height:100dvh;background:var(--bg);color:var(--text);font:500 13px/1.4 var(--font-ui);overflow:hidden;-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#boot{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center}
#boot.hide{opacity:0!important;pointer-events:none!important;visibility:hidden!important;display:none!important}
#sn-topchrome,#dock{opacity:0;transition:opacity 1.05s ease,transform 1.05s cubic-bezier(.22,1,.36,1)}
#sn-topchrome{transform:translateY(-14px)}
#dock{transform:translateY(18px)}
body.sn-hud-live #sn-topchrome,body.sn-hud-live #dock{opacity:1;transform:none}
#globe{position:fixed;inset:0;z-index:1;width:100%;height:100%;overflow:hidden}
#globe canvas{position:absolute!important;left:0!important;top:0!important;width:100%!important;height:100%!important;display:block!important;touch-action:none;-webkit-tap-highlight-color:transparent}
#sn-topchrome{position:fixed;top:0;left:0;right:0;z-index:95;display:flex;justify-content:center;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none}
#sn-topchrome-panel{pointer-events:auto;width:min(720px,100%);background:linear-gradient(180deg,rgba(8,22,64,0.28),rgba(0,6,22,0.36));border:1px solid var(--border);border-radius:var(--r);overflow:hidden;backdrop-filter:blur(11px) saturate(1.4);box-shadow:0 0 0 1px rgba(40,120,255,0.22),0 0 24px rgba(28,140,255,0.28),inset 0 0 28px rgba(12,50,160,0.16)}
#sn-topchrome-drag,#cli-drag{height:10px!important;min-height:10px!important;max-height:10px!important;padding:0!important;margin:0!important;display:flex;align-items:center;justify-content:center;cursor:ns-resize}
#sn-topchrome-drag::before,#cli-drag::before{content:"";width:36px;height:3px;border-radius:999px;background:linear-gradient(90deg,transparent,#1c8cff,#7ec8ff,#1c8cff,transparent);box-shadow:0 0 10px #1c8cff}
#sn-topchrome-drag::after,#cli-drag::after{content:none!important;display:none!important}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:100;display:flex;justify-content:center;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
#panel{pointer-events:auto;width:min(720px,100%);background:linear-gradient(180deg,rgba(6,18,52,0.30),rgba(0,4,18,0.38));border:1px solid var(--border);border-radius:var(--r);display:grid;grid-template-rows:10px 44px auto auto;overflow:visible;backdrop-filter:blur(11px) saturate(1.4);box-shadow:0 0 0 1px rgba(40,120,255,0.22),0 0 24px rgba(28,140,255,0.28),inset 0 0 28px rgba(12,50,160,0.16)}
.sn-cli-field{display:flex!important;align-items:center!important;gap:8px!important;width:100%!important;min-height:36px!important;padding:0 10px!important;background:rgba(0,10,32,0.42)!important;border:1px solid rgba(80,180,255,0.55)!important;border-radius:12px!important;box-shadow:inset 0 0 12px rgba(20,90,220,0.18),0 0 10px rgba(28,140,255,0.18)!important}
#stc-cmd,#cli-form{padding:4px 10px 10px;margin:0;min-height:48px}
#cli-in,#stc-cmd-in{background:transparent!important;border:0!important;color:#f4f6f8;font:500 14px/1.3 var(--font-mono);width:100%;outline:none}
#cli-in::placeholder,#stc-cmd-in::placeholder{color:#7a8a96;opacity:0.65}
#cli-coach{display:none!important;height:0!important}
#sn-task-ribbon{display:flex;gap:6px;padding:4px 8px;height:44px;min-height:44px;max-height:44px;align-items:center;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.sn-rib-btn{flex:0 0 36px;width:36px;height:36px;min-width:36px;max-width:36px;padding:0;border-radius:50%;border:1px solid rgba(80,180,255,0.55);background:rgba(0,12,40,0.35);color:#eaf4ff;font:600 14px/1 var(--font-ui);overflow:hidden;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 8px rgba(28,140,255,0.25)}
.sn-cli-star{color:#7ec8ff;text-shadow:0 0 10px #1c8cff}
#stc-compact{display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:4px 10px;min-height:52px;max-height:56px}
#field-radar{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(80,180,255,0.35),#020617);box-shadow:0 0 12px rgba(28,140,255,0.35)}
#btn-home{font:800 15px/1.1 var(--font-display);letter-spacing:0.28em;color:#7ec8ff;background:transparent;border:0;text-shadow:0 0 14px rgba(28,140,255,.7)}
#field-balance-hud{padding:6px 12px;border-radius:16px;border:1px solid var(--border);background:rgba(0,10,32,0.28)}
#sn-task-launch{width:40px;height:40px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,rgba(20,195,243,0.35),#060d1c)}
</style>
</head>
<body>
<div id="boot" aria-label="ASTRANOV loading" aria-busy="true">
  <div style="text-align:center">
    <span style="font:800 20px/1 Space Grotesk,system-ui,sans-serif;letter-spacing:0.36em;color:#14c3f3">ASTRANOV</span>
    <div style="width:148px;height:5px;margin:22px auto 0;border-radius:999px;overflow:hidden;background:rgba(20,195,243,0.15)"><span style="display:block;height:100%;width:40%;background:linear-gradient(90deg,#14c3f3,#7ee9ff)"></span></div>
  </div>
</div>
<div id="globe" aria-label="Earth"></div>
<div id="city-map" aria-hidden="true"></div>
<div id="sn-topchrome" aria-label="Top scroll">
  <div id="sn-topchrome-panel" class="collapsed" role="region" aria-label="Top scroll">
    <div id="stc-body">
      <div id="stc-compact">
        <div class="stc-col-radar"><div id="field-radar"></div></div>
        <div class="stc-col-device" style="text-align:center"><button type="button" id="btn-home">ASTRANOV</button></div>
        <div class="stc-col-money" style="display:flex;align-items:center;gap:10px;justify-content:flex-end">
          <div id="field-balance-hud"><span id="fbh-s">⭐ 0.00</span></div>
          <button type="button" id="sn-task-launch" class="mode-standby" aria-label="Task launcher"></button>
        </div>
      </div>
    </div>
    <form id="stc-cmd" autocomplete="off" aria-label="Flight command">
      <label class="sn-cli-field">
        <span class="sn-cli-star" aria-hidden="true">★</span>
        <input id="stc-cmd-in" type="text" autocomplete="off" spellcheck="false"
          placeholder="Heads up display command line interface"
          aria-label="Heads up display command line interface" />
      </label>
    </form>
    <div id="sn-topchrome-drag" title="Drag to expand" aria-label="Top scroll handle"></div>
  </div>
</div>
<div id="dock">
  <div id="panel" class="collapsed">
    <div id="cli-drag" title="Drag to expand CLI" aria-label="CLI handle"></div>
    <div id="sn-task-ribbon" aria-label="Quick actions">
      <button type="button" class="sn-rib-btn" data-act="locate" id="sn-rib-locate" title="Locate">📍</button>
      <button type="button" class="sn-rib-btn" data-act="polygon" id="sn-rib-poly" title="Poly">🔶</button>
      <button type="button" class="sn-rib-btn" data-act="user" id="sn-rib-user" title="Login">👤</button>
      <button type="button" class="sn-rib-btn" data-act="call" id="sn-rib-call" title="Call">📞</button>
      <button type="button" class="sn-rib-btn" data-act="add" id="sn-rib-add" title="Add">➕</button>
      <button type="button" class="sn-rib-btn" data-act="layers" id="sn-rib-layers" title="Layers">🗺️</button>
      <button type="button" class="sn-rib-btn" data-act="handsfree" id="sn-rib-hf" title="Talk to Astranov · mic on">🎤</button>
      <button type="button" class="sn-rib-btn" data-act="send" id="sn-rib-send" title="Send">📤</button>
    </div>
    <div id="cli-log" aria-live="polite"></div>
    <form id="cli-form" autocomplete="off">
      <label class="sn-cli-field">
        <span class="sn-cli-star" aria-hidden="true">★</span>
        <input id="cli-in" type="text" autocomplete="off" spellcheck="false"
          placeholder="command line interface"
          aria-label="command line interface" />
      </label>
    </form>
  </div>
</div>
<script src="/js/spacenet/mobile-life.js?v=20260824010000-place-live"></script>

<script src="/js/spacenet/chrome-radar.js?v=20260824010000-place-live"></script>
<script src="/js/spacenet/os-bootloader.js?v=20260824010000-place-live"></script>
